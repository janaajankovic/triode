spring.application.name=triode

# Database: defaults match docker-compose.yml for local development.
# In AWS these are supplied as environment variables from Secrets Manager.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triode}
spring.datasource.username=${DB_USERNAME:triode}
spring.datasource.password=${DB_PASSWORD:triode}
# Keep PostgreSQL's "Detail:" line (the conflicting row's values, e.g. customer id and Idempotency-Key) out of
# exception messages and therefore out of logs. Constraint names stay in the message.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Flyway owns the schema; Hibernate only validates it (the app fails to start if entities and tables differ).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.threads.virtual.enabled=true

# API request bodies (ADR 0010). Larger declared bodies get 413 from RequestBodySizeFilter before they are read;
# chunked bodies without Content-Length are stopped by Jackson's document-length limit (same value, also 413).
# Size from the domain limits: worst case every code point is a non-BMP character sent as an escaped surrogate pair
# ("😀" = 12 bytes), so subject 255 x 12 + body 10,000 x 12 = 123,060 bytes plus a little JSON syntax.
# 128 KB covers every valid ticket; if Ticket.MAX_*_LENGTH grows, raise this too.
triode.api.max-request-body-bytes=131072
spring.jackson.factory.constraints.read.max-document-length=${triode.api.max-request-body-bytes}
# Unknown JSON properties are a 400, not silently ignored (e.g. a client sending "status": "RESOLVED").
spring.jackson.deserialization.fail-on-unknown-properties=true
